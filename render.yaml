# Blueprint do Render (100% gratuito): New + > Blueprint > selecione este repositorio.
# Cria o CMS (Payload em Docker) e o site (Next.js) no plano free.
# Antes de aplicar, crie um Postgres gratuito no Neon (neon.tech) ou Supabase e cole a URL em DATABASE_URI.
services:
  - type: web
    name: allx-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /admin/login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URI
        sync: false # cole aqui a connection string postgres://... do Neon ou Supabase
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SERVER_URL
        value: https://allx-backend.onrender.com # troque se o Render der outra URL
      - key: FRONTEND_URL
        value: https://allx-frontend.onrender.com

  - type: web
    name: allx-frontend
    runtime: node
    rootDir: front-end
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_CMS_URL
        value: https://allx-backend.onrender.com
